[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krea-api"
version = "0.1.0"
description = "Python client for the Krea API: Krea 2 Large photographic text-to-image generation via a hosted endpoint."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "krea-dev"}]
keywords = ["ai api", "krea", "krea api", "krea python", "krea-2-large", "synexa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/krea-dev/krea-api"
Documentation = "https://krea-dev.github.io/krea-api/"
"Hosted model" = "https://synexa.ai/explore/krea/krea-2-large?utm_source=github&utm_medium=ugc&utm_campaign=krea-dev&utm_content=pyproject&utm_term=tier-c"

[tool.setuptools.packages.find]
include = ["krea_api*"]
